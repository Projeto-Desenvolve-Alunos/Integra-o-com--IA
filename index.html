<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <title>Integração IA</title>
</head>

<body>
    <header>
        <h1>Chat com IA</h1>
    </header>
    <main>
        <label for="apiKey">API Key:</label>
        <div class="input-with-button">
            <input type="password" id="apiKey" placeholder="Digite sua API Key">
            <button id="btnToggleApiKey" class="toggle-btn" type="button"><i class="bi bi-eye"></i></button>
        </div>
        <label for="modelo">Modelo:</label>
        <select id="modelo">
            <option value="">Selecione um modelo</option>
            <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
            <option value="gpt-3.5-turbo-16k">gpt-3.5-turbo-16k</option>
            <option value="gpt-4">gpt-4</option>
            <option value="gpt-4-32k">gpt-4-32k</option>
            <option value="gpt-4-turbo">gpt-4-turbo</option>
            <option value="gpt-4o">gpt-4o</option>
            <option value="gpt-4.1">gpt-4.1</option>
            <option value="gpt-4.1-mini">gpt-4.1-mini</option>
            <option value="gpt-4.1-nano">gpt-4.1-nano</option>
            <option value="gemini-pro">gemini-pro</option>
        </select>

        <label for="pergunta">Pergunta:</label>
        <textarea id="pergunta" rows="3" placeholder="Digite sua pergunta"></textarea>
        <div id="charCount">0 caracteres</div>

        <div class="btn-group">
            <button id="btnPerguntar"><i class="bi bi-search"></i> Perguntar</button>
            <button id="btnCopiar"><i class="bi bi-clipboard-check"></i> Copiar</button>
            <button id="btnLimpar"><i class="bi bi-trash"></i> Limpar</button>
        </div>
        <div id="resposta"></div>
    </main>
    <footer>
        <p>A IA pode cometer erros. Verifique atentamente sua resposta</p>
        <p>&copy; 2025 Group 3-10Desenvolve. Todos os direitos reservados.</p>
    </footer>
    <script src="./scripts/iaRequest.js"></script>
    <script>
        const perguntaInput = document.getElementById('pergunta');
        const respostaDiv = document.getElementById('resposta');
        const apiKeyInput = document.getElementById('apiKey');
        const modeloSelect = document.getElementById('modelo');
        const btnPerguntar = document.getElementById('btnPerguntar');
        const btnLimpar = document.getElementById('btnLimpar');
        const btnCopiar = document.getElementById('btnCopiar');
        const charCount = document.getElementById('charCount');
        const btnToggleApiKey = document.getElementById('btnToggleApiKey');

        apiKeyInput.value = localStorage.getItem('apiKey') || '';
        apiKeyInput.addEventListener('input', () => {
            localStorage.setItem('apiKey', apiKeyInput.value);
        });

        btnToggleApiKey.addEventListener('click', () => {
            const isPassword = apiKeyInput.type === 'password';
            apiKeyInput.type = isPassword ? 'text' : 'password';
            btnToggleApiKey.querySelector('i').className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
        });

        perguntaInput.addEventListener('input', () => {
            charCount.textContent = perguntaInput.value.length + " caracteres";
        });

        const mostrarResposta = () => respostaDiv.style.display = 'block';
        const esconderResposta = () => respostaDiv.style.display = 'none';
        const desabilitarBotao = () => { btnPerguntar.disabled = true; btnPerguntar.textContent = 'Consultando...'; };
        const habilitarBotao = () => { btnPerguntar.disabled = false; btnPerguntar.innerHTML = '<i class="bi bi-search"></i> Perguntar'; };

        const perguntarIA = async () => {
            const pergunta = perguntaInput.value.trim();
            const apiKey = apiKeyInput.value.trim();
            const modelo = modeloSelect.value;

            if (!pergunta || !apiKey || !modelo) {
                respostaDiv.innerHTML = '<strong>Atenção:</strong> Preencha todos os campos (API Key, Modelo e Pergunta).';
                mostrarResposta();
                return;
            }

            desabilitarBotao();
            respostaDiv.innerHTML = `<strong>Pergunta:</strong> ${pergunta}<br><br><strong>Resposta:</strong> Consultando IA...`;
            mostrarResposta();

            const ia = modelo.includes('gemini') ? 'gemini' : 'openai';

            try {
                const resposta = await iaRequest(pergunta, apiKey, ia, modelo);
                respostaDiv.innerHTML = `<strong>Pergunta:</strong> ${pergunta}<br><br><strong>Resposta:</strong> ${resposta}`;
            } catch (err) {
                respostaDiv.innerHTML = `<strong>Pergunta:</strong> ${pergunta}<br><br><strong>Resposta:</strong> Erro na requisição: ${err.message}`;
            } finally {
                habilitarBotao();
            }
        };

        btnPerguntar.addEventListener('click', perguntarIA);
        perguntaInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') perguntarIA(); });

        btnLimpar.addEventListener('click', () => {
            if (confirm("Deseja limpar a pergunta e resposta?")) {
                perguntaInput.value = "";
                respostaDiv.textContent = "";
                charCount.textContent = "0 caracteres";
                esconderResposta();
            }
        });

        btnCopiar.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(respostaDiv.innerText);
                alert("Resposta copiada com sucesso!");
            } catch {
                alert("Erro ao copiar. Seu navegador não suporta clipboard.");
            }
        });

        esconderResposta();
    </script>
</body>

</html>
